<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>

<nav th:replace="~{layout :: navbar}"></nav>

<main class="container mt-3">

    <div class="page-banner">
        <h1>Mi trabajo actual</h1>
        <p>Festival activo y unidad de venta en la que trabajás</p>
    </div>

    <div class="d-flex justify-content-end mb-3">
        <a class="btn btn-dark text-white" th:href="@{/empleado}">Volver al panel</a>
    </div>

    <div th:if="${actual != null}" class="table-responsive mb-4">
        <table class="table align-middle">
            <thead>
            <tr>
                <th>Festival</th>
                <th>Inicio</th>
                <th>Fin</th>
                <th>Estado</th>
                <th>Unidad de Venta</th>
                <th>Código</th>
                <th>Tipo de Unidad</th>
            </tr>
            </thead>
            <tbody>
            <tr>
                <td th:text="${actual.festival.nombre}"></td>
                <td th:text="${#temporals.format(actual.festival.fechaInicio, 'dd/MM/yyyy')}"></td>
                <td th:text="${#temporals.format(actual.festival.fechaFin, 'dd/MM/yyyy')}"></td>
                <td>Activo</td>
                <td th:text="${actual.nombreUnidad}"></td>
                <td th:text="${actual.codigoUnidad}"></td>
                <td th:text="${actual.tipoUnidad}"></td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:if="${actual == null}" class="alert alert-secondary">
        Actualmente no tenés asignado ningún festival activo.
    </div>

</main>

<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>

</body>
</html>
