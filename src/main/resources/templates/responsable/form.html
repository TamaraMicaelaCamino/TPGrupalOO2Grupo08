<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>

<nav th:replace="~{layout :: navbar}"></nav>

<main class="container mt-3">

    <div class="page-banner">
        <h1>Alta de empleado</h1>
        <p>Le vamos a enviar un mail con su usuario y una contraseña para ingresar</p>
    </div>

    <div class="mx-auto" style="max-width: 900px;">
        <div class="form-group">
            <label for="tipoEmpleado">Tipo de empleado</label>

            <select id="tipoEmpleado"
                    class="form-control"
                    onchange="window.location.assign(this.value)">

                <option th:value="@{/responsable/empleados/nuevo/cajero}"
                        th:selected="${tipo == 'cajero'}">
                    Cajero
                </option>

                <option th:value="@{/responsable/empleados/nuevo/cocina}"
                        th:selected="${tipo == 'cocina'}">
                    Personal de cocina
                </option>

            </select>
        </div>

        <form th:action="@{/responsable/empleados/{tipo}(tipo=${tipo})}" th:object="${empleado}" method="post">

            <div th:replace="~{registro/campos :: erroresGlobales}"></div>

            <div class="row">
                <div class="col-md-6">
                    <h4>Datos personales</h4>
                    <div class="form-group">
                        <label>Nombre</label>
                        <input type="text" class="form-control" th:field="*{nombre}">
                        <small class="text-danger" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></small>
                    </div>
                    <div class="form-group">
                        <label>Apellido</label>
                        <input type="text" class="form-control" th:field="*{apellido}">
                        <small class="text-danger" th:if="${#fields.hasErrors('apellido')}" th:errors="*{apellido}"></small>
                    </div>
                    <div class="form-group">
                        <label>DNI</label>
                        <input type="number" class="form-control" th:field="*{dni}">
                        <small class="text-danger" th:if="${#fields.hasErrors('dni')}" th:errors="*{dni}"></small>
                    </div>
                    <div class="form-group">
                        <label>Fecha de nacimiento</label>
                        <input type="date" class="form-control" th:field="*{fechaNacimiento}">
                        <small class="text-danger" th:if="${#fields.hasErrors('fechaNacimiento')}" th:errors="*{fechaNacimiento}"></small>
                    </div>
                </div>

                <div class="col-md-6">
                    <h4>Datos laborales</h4>
                    <div class="form-group">
                        <label>Email (será su usuario)</label>
                        <input type="email" class="form-control" th:field="*{email}">
                        <small class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></small>
                    </div>
                    <div class="form-group">
                        <label>Fecha de ingreso</label>
                        <input type="date" class="form-control" th:field="*{fechaIngreso}">
                        <small class="text-danger" th:if="${#fields.hasErrors('fechaIngreso')}" th:errors="*{fechaIngreso}"></small>
                    </div>

                    <div th:if="${tipo == 'cajero'}">
                        <div class="form-group">
                            <label>Turno</label>
                            <select class="form-control" th:field="*{turno}">
                                <option value="">Elegí un turno</option>
                                <option th:each="t : ${turnos}" th:value="${t}" th:text="${t}"></option>
                            </select>
                            <small class="text-danger" th:if="${#fields.hasErrors('turno')}" th:errors="*{turno}"></small>
                        </div>
                    </div>

                    <div th:if="${tipo == 'cocina'}">
                        <div class="form-group">
                            <label>Categoría</label>
                            <select class="form-control" th:field="*{categoria}">
                                <option value="">Elegí una categoría</option>
                                <option th:each="c : ${categorias}" th:value="${c}" th:text="${c}"></option>
                            </select>
                            <small class="text-danger" th:if="${#fields.hasErrors('categoria')}" th:errors="*{categoria}"></small>
                        </div>
                        <div class="form-group">
                            <label>Vencimiento del carnet de manipulación</label>
                            <input type="date" class="form-control" th:field="*{vencimientoCarnetDeManipulacion}">
                            <small class="text-danger" th:if="${#fields.hasErrors('vencimientoCarnetDeManipulacion')}"
                                   th:errors="*{vencimientoCarnetDeManipulacion}"></small>
                        </div>
                    </div>
                </div>
            </div>

            <div class="text-center mt-3 mb-5">
                <button type="submit" class="btn btn-dark">Dar de alta</button>
                <a class="btn btn-outline-dark ml-2" th:href="@{/responsable/empleados}">Cancelar</a>
            </div>
        </form>
    </div>

</main>

<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>

</body>
</html>
