<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout :: head}"></head>

<body>

<nav th:replace="~{layout :: navbar}"></nav>

<main class="container mt-3">

    <div class="page-banner">
        <h1>Pedidos</h1>
        <p>Consultá los pedidos de tus unidades de venta.</p>
    </div>

    <div class="d-flex justify-content-end mb-3">
        <a class="btn btn-dark" th:href="@{/responsable}">
            Volver al panel
        </a>
    </div>

    <form th:action="@{/responsable/pedidos}"
          method="get"
          class="mb-4">

        <div class="form-group">
            <label for="idUnidadDeVenta">Unidad de venta</label>

            <select id="idUnidadDeVenta"
                    name="idUnidadDeVenta"
                    class="form-control">

                <option value=""
                        th:selected="${idUnidadDeVenta == null}">
                    Todas mis unidades
                </option>

                <option th:each="u : ${unidades}"
                        th:value="${u.idUnidadDeVenta}"
                        th:text="${u.nombre}"
                        th:selected="${u.idUnidadDeVenta == idUnidadDeVenta}">
                </option>
            </select>
        </div>

        <button type="submit" class="btn btn-dark">
            Consultar
        </button>
    </form>

    <div class="table-responsive mb-4">
        <table class="table table-striped table-hover">

            <thead>
            <tr>
                <th>Número de pedido</th>
                <th>Fecha de transacción</th>
                <th>Total</th>
                <th>Unidad de venta</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="p : ${pedidos}"
                th:classappend="${p.idPedido == idPedido} ? 'table-active' : ''">

                <td>
                    <a class="font-weight-bold"
                       th:href="@{/responsable/pedidos(idUnidadDeVenta=${idUnidadDeVenta},idPedido=${p.idPedido})}"
                       th:text="|Ver pedido ${p.idPedido}|">
                    </a>
                </td>

                <td th:text="${#temporals.format(
                    p.fechaTransaccion, 'dd/MM/yyyy'
                )}"></td>

                <td th:text="${#numbers.formatDecimal(
                    p.total, 1, 'POINT', 2, 'COMMA'
                )}"></td>

                <td th:text="${p.nombreUnidad}"></td>
            </tr>

            <tr th:if="${#lists.isEmpty(pedidos)}">
                <td colspan="4" class="text-center text-muted">
                    No hay pedidos para la selección actual.
                </td>
            </tr>
            </tbody>

        </table>
    </div>

    <section id="detalle"
             class="mb-4"
             th:if="${pedidoSeleccionado != null}">

        <h3 th:text="|Detalle del pedido ${pedidoSeleccionado.idPedido}|"></h3>

        <p th:text="|Unidad: ${pedidoSeleccionado.nombreUnidad}|"></p>

        <div class="table-responsive">
            <table class="table table-striped">

                <thead>
                <tr>
                    <th>Nombre del Plato</th>
                    <th>Cantidad</th>
                    <th>Precio unitario</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="d : ${pedidoSeleccionado.detalles}">
                    <td th:text="${d.nombrePlato}"></td>
                    <td th:text="${d.cantidad}"></td>

                    <td th:text="${#numbers.formatDecimal(
                        d.precioVenta, 1, 'POINT', 2, 'COMMA'
                    )}"></td>
                </tr>
                </tbody>

            </table>
        </div>

        <a class="btn btn-outline-dark"
           th:href="@{/responsable/pedidos(idUnidadDeVenta=${idUnidadDeVenta})}">
            Cerrar detalle
        </a>
    </section>
</main>

<footer th:replace="~{layout :: footer}"></footer>

<div th:replace="~{layout :: scripts}"></div>

</body>
</html>
