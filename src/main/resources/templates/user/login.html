<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>

<nav th:replace="~{layout :: navbar}"></nav>

<main>
    <div class="login-container">
        <div class="card login-card">

            <div class="page-banner login-banner">
                <h1>Iniciar sesión</h1>
                <p>Completá con tus credenciales</p>
            </div>

            <div class="card-body">

                <div th:if="${error != null}" class="alert alert-danger">
                    Usuario o contraseña inválidos.
                </div>

                <div th:if="${logout != null}" class="alert alert-success">
                    Sesión finalizada correctamente.
                </div>

                <form th:action="@{/loginprocess}" method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label">Usuario</label>
                        <input type="text" class="form-control" id="username" name="username" required autofocus placeholder="Ingrese su usuario"/>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Contraseña</label>
                        <div class="password-wrapper">
                            <input type="password" class="form-control" id="password" name="password" required placeholder="Ingrese su contraseña"/>
                            <button type="button" class="toggle-password" aria-label="Mostrar u ocultar contraseña">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-dark w-100">Ingresar</button>
                </form>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>

</body>
</html>
