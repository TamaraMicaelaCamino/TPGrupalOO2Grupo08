<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="erroresGlobales">
  <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
    <p class="mb-0" th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p>
  </div>
</div>

<div class="col-md-6" th:fragment="selectorTipo">
  <h4>Tipo de unidad</h4>
  <div class="form-group">
    <select class="form-control selector-tipo">
      <option value="foodtruck">Food truck</option>
      <option value="puesto">Puesto desarmable</option>
    </select>
  </div>
</div>

<div class="row" th:fragment="filaInferior">
  <div class="col-md-6">
    <h4>Datos de la unidad</h4>
    <div th:replace="~{registro/campos :: comunes}"></div>
  </div>
  <div class="col-md-6">
    <h4>Datos del responsable</h4>
    <div th:replace="~{registro/campos :: responsable}"></div>

    <div class="text-center mt-4">
      <button type="submit" class="btn btn-dark">Registrar</button>
    </div>
  </div>
</div>

<div th:fragment="comunes">
  <div class="form-group">
    <label>Festival</label>
    <select class="form-control" th:field="*{idFestival}">
      <option value="">Elegí un festival</option>
      <option th:each="f : ${festivales}" th:value="${f.idFestival}" th:text="${f.nombre}"></option>
    </select>
    <small class="text-danger" th:if="${#fields.hasErrors('idFestival')}" th:errors="*{idFestival}"></small>
  </div>
  <div class="form-group">
    <label>Nombre comercial</label>
    <input type="text" class="form-control" th:field="*{nombre}">
    <small class="text-danger" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></small>
  </div>
  <div class="form-group">
    <label>Superficie en m²</label>
    <input type="number" step="0.01" class="form-control" th:field="*{superficieOcupada}">
    <small class="text-danger" th:if="${#fields.hasErrors('superficieOcupada')}" th:errors="*{superficieOcupada}"></small>
  </div>
  <div class="form-group">
    <label>Código (10 caracteres)</label>
    <input type="text" class="form-control" maxlength="10" th:field="*{codigo}">
    <small class="text-danger" th:if="${#fields.hasErrors('codigo')}" th:errors="*{codigo}"></small>
  </div>
</div>

<div th:fragment="responsable">
  <div class="form-group">
    <label>Usuario</label>
    <input type="text" class="form-control" th:field="*{usuario.username}">
    <small class="text-danger" th:if="${#fields.hasErrors('usuario.username')}" th:errors="*{usuario.username}"></small>
  </div>
  <div class="form-group">
    <label>Contraseña</label>
    <div class="password-wrapper">
      <input type="password" class="form-control" th:field="*{usuario.password}">
      <button type="button" class="toggle-password" aria-label="Mostrar u ocultar contraseña">
        <i class="bi bi-eye"></i>
      </button>
    </div>
    <small class="text-danger" th:if="${#fields.hasErrors('usuario.password')}" th:errors="*{usuario.password}"></small>
  </div>
</div>

</body>
</html>
