<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="head">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Epicentro Gourmet</title>
  <link rel="stylesheet" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}"/>
  <link rel="stylesheet" th:href="@{/css/modern-business.css}"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top py-3" th:fragment="navbar">
  <div class="container">
    <a class="navbar-brand" th:href="@{/}">Epicentro Gourmet</a>

    <!-- Botón del menú en celular: solo con sesión iniciada -->
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav"
            sec:authorize="isAuthenticated()">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Enlaces y menú de usuario: solo con sesión iniciada -->
    <div class="collapse navbar-collapse" id="navbarNav" sec:authorize="isAuthenticated()">
      <ul class="navbar-nav mr-auto">
        <li class="nav-item">
          <a class="nav-link" th:href="@{/}">Inicio</a>
        </li>
      </ul>
      <ul class="navbar-nav">
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" role="button" data-toggle="dropdown">
            <span sec:authentication="name">Usuario</span>
          </a>
          <div class="dropdown-menu dropdown-menu-right">
            <form th:action="@{/logout}" method="post">
              <button type="submit" class="dropdown-item">Cerrar sesión</button>
            </form>
          </div>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- Footer -->
<footer class="bg-dark text-white py-4" th:fragment="footer">
  <div class="container text-center">
    <p class="mb-0">&copy; 2026 UNLA - TP HITO 2</p>
  </div>
</footer>

<!-- Scripts (los mismos en todas las páginas) -->
<div th:fragment="scripts">
  <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
  <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
  <script th:src="@{/js/password-toggle.js}"></script>
</div>

</body>
</html>
